<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Income</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

  <h3>Edit Income Entry</h3>

  <form method="POST" class="row g-3">
    <div class="col-md-4">
      <label>Source</label>
      <input type="text" name="source" class="form-control" value="{{ income.source }}" required>
    </div>
    <div class="col-md-3">
      <label>Amount (₹)</label>
      <input type="number" name="amount" class="form-control" value="{{ income.amount }}" required>
    </div>
    <div class="col-md-3">
      <label>Date</label>
      <input type="date" name="date" class="form-control" value="{{ income.date }}" required>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-success w-100">💾 Save</button>
    </div>
  </form>

  <a href="{{ url_for('income_page') }}" class="btn btn-secondary mt-3">⬅ Back</a>

</body>
</html>
