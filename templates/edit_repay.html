<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Repayment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

  <h3>Edit Repayment</h3>
  <form method="POST" class="row g-3">
    <div class="col-md-4">
      <input type="text" name="name" value="{{ repay.name }}" class="form-control" required>
    </div>
    <div class="col-md-3">
      <input type="number" step="0.01" name="amount" value="{{ repay.amount }}" class="form-control" required>
    </div>
    <div class="col-md-3">
      <input type="date" name="date" value="{{ repay.date.strftime('%Y-%m-%d') }}" class="form-control" required>
    </div>
    <div class="col-md-2">
      <select name="status" class="form-control">
        <option value="Unpaid" {% if repay.status == 'Unpaid' %}selected{% endif %}>Unpaid</option>
        <option value="Paid" {% if repay.status == 'Paid' %}selected{% endif %}>Paid</option>
      </select>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-success">💾 Save</button>
      <a href="{{ url_for('savings_page') }}" class="btn btn-secondary">⬅ Back</a>
    </div>
  </form>

</body>
</html>
