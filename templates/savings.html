<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Savings / Repay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

  <h3>Repayments</h3>

  <!-- Add Repayment Form -->
  <form method="POST" class="row g-3 mb-4">
    <div class="col-md-4">
      <input type="text" name="name" placeholder="Name" class="form-control" required>
    </div>
    <div class="col-md-3">
      <input type="number" step="0.01" name="amount" placeholder="Amount" class="form-control" required>
    </div>
    <div class="col-md-3">
      <input type="date" name="date" class="form-control">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-success w-100">➕ Add</button>
    </div>
  </form>

  <!-- Repayments Table -->
<table class="table table-bordered">
  <thead>
    <tr>
      <th>Name</th>
      <th>Amount (₹)</th>
      <th>Date</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for r in repayments %}
    <tr>
      <td>{{ r.name }}</td>
      <td>{{ r.amount }}</td>
      <td>{{ r.date.strftime("%Y-%m-%d") }}</td>
      <td>
        {% if r.status == "Paid" %}
          <span class="badge bg-success">Paid</span>
        {% else %}
          <span class="badge bg-warning text-dark">Unpaid</span>
        {% endif %}
      </td>
      <td>
        <a href="{{ url_for('edit_repay', repay_id=r.id) }}" class="btn btn-sm btn-primary">✏ Edit</a>
        <form action="{{ url_for('delete_repay', repay_id=r.id) }}" method="POST" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-danger">🗑 Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="text-center">No repayments yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

  </table>

  <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>

</body>
</html>
