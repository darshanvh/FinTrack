<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Income</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Last 30 Days Income</h2>

    <!-- Chart -->
    <canvas id="incomeChart" height="100"></canvas>

    <hr>

    <!-- Income Table -->
    <h4>Income Records</h4>
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Source</th>
          <th>Amount (₹)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for inc in incomes %}
          <tr>
            <td>{{ inc.date.strftime("%Y-%m-%d") }}</td>
            <td>{{ inc.source }}</td>
            <td>{{ inc.amount }}</td>
            <td>
              <!-- Edit -->
              <a href="{{ url_for('edit_income', income_id=inc.id) }}" class="btn btn-sm btn-warning">Edit</a>

              <!-- Delete (Confirm before) -->
             <a href="{{ url_for('delete_income', id=inc.id) }}" class="btn btn-sm btn-danger">Delete</a>

            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
  </div>

  <script>
    const chartData = {{ chart_data | safe }};
    const ctx = document.getElementById('incomeChart').getContext('2d');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.map(d => d.date),
        datasets: [{
          label: 'Income',
          data: chartData.map(d => d.amount),
          borderColor: 'blue',
          backgroundColor: 'rgba(0, 0, 255, 0.2)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  </script>
</body>
</html>
