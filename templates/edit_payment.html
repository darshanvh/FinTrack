<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Payment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <div class="container">
    <h3>Edit Payment</h3>
    <form method="POST" class="row g-3">
      <div class="col-md-4">
        <input type="text" name="name" class="form-control" required value="{{ payment.name }}">
      </div>
      <div class="col-md-4">
        <input type="text" name="purpose" class="form-control" value="{{ payment.purpose }}">
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" name="amount" class="form-control" required value="{{ payment.amount }}">
      </div>
      <div class="col-md-2">
        <input type="date" name="date" class="form-control" value="{{ payment.date.strftime('%Y-%m-%d') }}">
      </div>
      <div class="col-md-2">
        <select name="status" class="form-select">
          <option value="Unpaid" {% if payment.status != 'Paid' %}selected{% endif %}>Unpaid</option>
          <option value="Paid" {% if payment.status == 'Paid' %}selected{% endif %}>Paid</option>
        </select>
      </div>
      <div class="col-12">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('payments_page') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
