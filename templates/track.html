<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .glass-card {
      border-radius: 1rem;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: 0.3s;
      cursor: pointer;
    }
    .glass-card:hover { transform: translateY(-5px); }
    .icon-wrap { font-size: 2rem; color: #007bff; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">📊 Track Income & Outcome</h2>
    <div class="row g-4">

      <!-- Monthly Outcome -->
      <div class="col-md-4">
        <div class="glass-card p-4">
          <a class="stretched-link" href="{{ url_for('monthly_tracker') }}"></a>

          <div class="icon-wrap"><i class="bi bi-arrow-down-circle"></i></div>
          <h5 class="mt-3">Monthly Outcome</h5>
          <p class="text-muted">View expenses for this month</p>
        </div>
      </div>

      <!-- Monthly Income -->
      <div class="col-md-4">
        <div class="glass-card p-4">
          <a class="stretched-link" href="{{ url_for('monthly_income') }}"></a>
          <div class="icon-wrap"><i class="bi bi-arrow-up-circle"></i></div>
          <h5 class="mt-3">Monthly Income</h5>
          <p class="text-muted">Track your monthly earnings</p>
        </div>
      </div>

      <!-- Balance / History -->
      <div class="col-md-4">
        <div class="glass-card p-4">
          <a class="stretched-link" href="{{ url_for('balance_today') }}"></a>
          <div class="icon-wrap"><i class="bi bi-wallet2"></i></div>
          <h5 class="mt-3">Cash in Hand</h5>
          <p class="text-muted">View balance, share & history</p>
        </div>
      </div>

       <!-- Balance / History -->
      <div class="col-md-4">
        <div class="glass-card p-4">
          <a class="stretched-link" href="{{ url_for('balance_today') }}"></a>
          <div class="icon-wrap"><i class="bi bi-wallet2"></i></div>
          <h5 class="mt-3">Cash in Hand</h5>
          <p class="text-muted">View balance, share & history</p>
        </div>
      </div>
 
    </div>
  </div>
</body>
</html>
